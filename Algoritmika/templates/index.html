<!DOCTYPE html>
<html>
<head>
    <title>Выбор роли</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .role-grid {
            display: grid;
            gap: 15px;
        }
        
        .role-card {
            display: block;
            padding: 20px;
            text-decoration: none;
            border-radius: 10px;
            transition: transform 0.2s;
            text-align: left;
        }
        
        .role-card:hover {
            transform: translateY(-3px);
        }
        
        .student-card {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }
        
        .parent-card {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
        }
        
        .employee-card {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
        }
        
        .role-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
        }
        
        .role-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .role-desc {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏫 Электронный дневник</h1>
        <div class="subtitle">Выберите ваш тип учетной записи</div>
        
        <div class="role-grid">
            <a href="/login/student/" class="role-card student-card">
                <span class="role-icon">🎓</span>
                <div class="role-title">Ученик</div>
                <div class="role-desc">Вход в электронный дневник</div>
            </a>
            
            <a href="/login/parent/" class="role-card parent-card">
                <span class="role-icon">👪</span>
                <div class="role-title">Родитель</div>
                <div class="role-desc">Контроль успеваемости ребенка</div>
            </a>
            
            <a href="/login/employee/" class="role-card employee-card">
                <span class="role-icon">👨‍🏫</span>
                <div class="role-title">Сотрудник</div>
                <div class="role-desc">Учителям, администрации и персоналу</div>
            </a>
        </div>
    </div>
</body>
</html>
